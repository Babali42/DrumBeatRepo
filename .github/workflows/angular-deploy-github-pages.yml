name: Deploy Angular App to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Scala
        uses: ./.github/actions/scala-test/

  angular-lint:
    needs: scala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Angular (lint)
        uses: ./.github/actions/angular-lint/

  angular-test:
    needs: scala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Angular (tests)
        uses: ./.github/actions/angular-test/
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
    
  check-i18n-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        
      - name: Verify i18n translations consistency
        run: bash ./verify_i18n_json.sh
        shell: bash
        working-directory: ./frontend

  build:
    needs: [angular-test, angular-lint, check-i18n-consistency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Download Scala.js artifact
        uses: actions/download-artifact@v8
        with:
          name: scalajs-artifact
          path: frontend/engine/

      - run: npm ci
        working-directory: frontend/

      - run: npm run build -- --output-path ../dist
        working-directory: frontend/

      - run: echo "www.drumbeatrepo.com" > dist/browser/CNAME

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/browser/

  deploy:
    needs: [angular-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

  sarif:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend/

      - run: npx eslint . --max-warnings=10 -f @microsoft/eslint-formatter-sarif -o eslint-results.sarif || true
        working-directory: frontend/

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend/eslint-results.sarif
          wait-for-processing: true