<ngx-loading-bar></ngx-loading-bar>

<ng-template #libraryControls>
  <div class="library-controls">
    <app-select-input [elements]="sequencerService.genresLabel"
      [selectedElement]="sequencerService.vm$.getValue().genre" (selectChange)="genreChange($event)"
      placeHolder="{{ 'chooseGenre' | translate }}">
    </app-select-input>
    <app-select-input [elements]="sequencerService.vm$.getValue().beats"
      [selectedElement]="sequencerService.vm$.getValue().beat" (selectChange)="beatChange($event)"
      placeHolder="{{ 'chooseBeat' | translate : { genre : sequencerService.vm$.getValue().genre } }}">
    </app-select-input>
  </div>
</ng-template>

@if (!isMobile()) {
<main class="flex app-container">
  <img src="../../assets/images/title.svg" id="title-image" alt="Website Title" class="top-left-corner cursor-pointer"
    (click)="goToMainPage()" />
  <section class="flex content column">
    <ng-container [ngTemplateOutlet]="libraryControls"></ng-container>
    <sequencer></sequencer>
  </section>
</main>
<footer class="flex justify-center">
  <a href="https://github.com/Babali42/DrumBeatRepo/issues/270" class="cursor-pointer">{{ 'contribute' | translate
    }}</a>
</footer>
} @else if (isMobile() && isLandscape) {
<main class="app-container">
  <section class="flex content column">
    <ng-container [ngTemplateOutlet]="libraryControls"></ng-container>
    <sequencer></sequencer>
  </section>
</main>
} @else if (isMobile() && isPortrait) {
<header class="header-mobile mt-40 mb-40">
  <img src="../../assets/images/title-mobile.svg" class="title-image-mobile" alt="Website Title" />
</header>
<div class="portrait-to-landscape">
  <img
    [src]="mode == Mode.LIGHT ? '../../assets/images/light/orientation.png' : `../../assets/images/dark/orientation.png`"
    class="portrait-to-landscape-image" alt="Portrait to landscape image" />
</div>
<div class="ml-10">
  <h1>{{ 'portraitMode.onlyAvailableInLandscapeMode' | translate }}</h1>
  <h3>{{ 'portraitMode.turnYourDevice' | translate }}</h3>
</div>
}
