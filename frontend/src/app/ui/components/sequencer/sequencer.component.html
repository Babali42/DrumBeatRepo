<div class="main-container">
  <div class="sequencer-header">
    <div class="flex label bpm-input-group">
      <button class="play-pause-button cursor-pointer app-button" (click)="this.soundService.playPause()">
        {{ this.soundService.isPlaying ? "⏸" : "▶" }}
      </button>
      <app-bpm-input [bpm]="this.tempoService.bpm" (bpmChange)="changeBeatBpm($event)"></app-bpm-input>
      <div class="flex">
        <button class="button square-button undo" (click)="sequencerService.dispatch({ type: 'UNDO'})"
          [disabled]="sequencerService.vm$.getValue().historyLength <= minHistoryLength">
          <img alt="undo" aria-label="Undo" [ngSrc]="'assets/images/icons/undo.svg' | iconDarkMode" height="28"
            width="28">
        </button>
        <button class="button square-button redo ml-8" (click)="this.sequencerService.dispatch({ type: 'REDO'})"
          [disabled]="sequencerService.vm$.getValue().futureLength <= 0">
          <img alt="redo" aria-label="Redo" [ngSrc]="'assets/images/icons/redo.svg' | iconDarkMode" height="28"
            width="28">
        </button>
      </div>
    </div>
    <div class="label">
      <app-select-input [elements]="sequencerService.genresLabel"
        [selectedElement]="sequencerService.vm$.getValue().genre" (selectChange)="this.genreChange($event)"
        placeHolder="{{ 'chooseGenre' | translate }}">
      </app-select-input>
    </div>
    <div class="label">
      <app-select-input [elements]="sequencerService.vm$.getValue().beats"
        [selectedElement]="sequencerService.vm$.getValue().beat" (selectChange)="beatChange($event)"
        placeHolder="{{ 'chooseBeat' | translate : { genre : sequencerService.vm$.getValue().genre } }}">
      </app-select-input>
    </div>
  </div>
  <div class="tracks-name-container">
    @for (track of beat.tracks; track track){
    <div class="tracks-name">
      <button class="button square-button" title="Play sample" (mousedown)="soundService.playTrack(track.name)">
        <img alt="drum" [ngSrc]="track.midiNote | drumImage | iconDarkMode" height="28" width="28">
      </button>
      <div class="track-name user-select-none medium">
        {{ track.name }}
      </div>
      <button class="button" [ngClass]="track.isMuted ? 'mute' : ''" (click)="toggleMuteTrack(track.name)">M</button>
    </div>
    }
    @if(AddTrackFeatureToggle) {
    <div class="tracks-name">
      <button class="button square-button" title="Play sample" (mousedown)="this.addTrack()">
        <img alt="drum" [ngSrc]="`assets/images/icons/add.svg` | iconDarkMode" height="28" width="28">
      </button>
      <div class="track-name user-select-none medium">
        Add a track
      </div>
    </div>
    }
  </div>
  <section class="tracks-container">
    @for (track of beat.tracks; track $index) {
    <article>
      <div id="track" [class.eight-steps]="track.numberOfSteps == NumberOfSteps.eight"
        [class.sixteen-steps]="track.numberOfSteps == NumberOfSteps.sixteen"
        [class.thirty-two-steps]="track.numberOfSteps == NumberOfSteps.thirty_two"
        [class.sixty-four-steps]="track.numberOfSteps == NumberOfSteps.sixty_four">
        @for (step of track.steps.steps; track $index){
        <button class="step cursor-pointer" [class.active]="getStepActive(track.name, $index, step)"
          [class.current]="$index === soundService.index" [class.highlight]="Math.floor($index / 4) % 2 === 0"
          [class.drag-range]="isInDragRange(track.name, $index)" (mousedown)="onStepMouseDown(track, $index)"
          (mouseenter)="onStepMouseEnter(track.name, $index)" (mouseup)="onStepMouseUp(track.name, $index)">
        </button>
        }
      </div>
    </article>
    }
    @if(AddTrackFeatureToggle) {
    <article>
      <div id="track">
        empty
      </div>
    </article>
    }
  </section>
  <section class="export-button-container flex">
    <button class="button" (click)="isAudioExportModalOpen = true">{{ 'export.wavButton' | translate
      }}</button>
    <button class="button ml-8" (click)="isMidiExportModalOpen = true">{{ 'exportMidi.button' | translate
      }}</button>
  </section>
</div>

<app-export-modal [isOpen]="isAudioExportModalOpen" [beatName]="beat.label" (close)="isAudioExportModalOpen = false"
  (validate)="onAudioExport($event)">
</app-export-modal>

<app-export-midi-modal [isOpen]="isMidiExportModalOpen" [beatName]="beat.label" (close)="isMidiExportModalOpen = false"
  (validate)="onMidiExport($event)">
</app-export-midi-modal>

<app-browse-audio-samples-modal [isOpen]="isBrowseAudioSamplesModalOpen"
  (close)="isBrowseAudioSamplesModalOpen = false">
</app-browse-audio-samples-modal>
